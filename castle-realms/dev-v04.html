<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Castle Realms V0.4</title><style>*{box-sizing:border-box}html,body{margin:0;overflow:hidden;overscroll-behavior:none;background:#53643b;color:#f4e6c7;font-family:Georgia}canvas{width:100vw;height:100dvh;display:block;touch-action:none}header,aside,footer{position:fixed;padding:14px}header{top:env(safe-area-inset-top);pointer-events:none;text-shadow:0 2px 4px #000}aside{right:0;top:env(safe-area-inset-top);display:grid;gap:8px}footer{bottom:env(safe-area-inset-bottom);width:100%;display:flex;justify-content:space-between;align-items:center}button{background:#25352d;color:#f8e9c8;border:1px solid #b4a178;border-radius:8px;min-height:44px;min-width:44px;font:18px Georgia}small{background:#18271de0;padding:8px}#detail{position:fixed;bottom:85px;left:12px;right:12px;background:#19251fee;padding:14px;border:1px solid #a99465;border-radius:8px}select{background:#25352d;color:white;padding:10px}#detail{max-height:55vh;overflow:auto;z-index:5}#detail button{font-size:14px;margin:4px}</style></head><body><canvas id="land"></canvas><header><small>CASTLE REALMS · V0.4</small><h2>Your Kingdom</h2><span id="lv">Castle Level 1</span></header><aside><select id="preview"><option value="1">Lv 1</option><option value="5">Lv 5</option><option value="6">Lv 6</option><option value="10">Lv 10</option><option value="11">Lv 11</option><option value="15">Lv 15</option><option value="20">Lv 20</option><option value="24">Lv 24</option><option value="25">Lv 25</option><option value="40">Lv 40</option></select><button id="lord">Lord</button><button id="plus">+</button><button id="minus">−</button></aside><div id="detail" hidden></div><footer><button id="collect">Collect All</button><small>Preview</small><button id="home">⌂ Castle</button></footer><script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d'),detail=document.querySelector('#detail');let W,H,D,zoom=1.15,px=0,py=0,vx=0,vy=0,dirty=true,scale=1,faces=[],labels=[],seed=71;const cos=Math.cos(.65),sin=Math.sin(.65);
let buildings=[],level=1;const defs=[["Castle",0,0,"Castle controls building level cap; wall and additional prerequisite required. Gold from level 25."],["Barracks",-10,-10,"All troop types; one training queue. Level controls tiers, capacity and speed."],["Warehouse",0,-12,"Unlimited balance; level controls protection from plunder."],["Academy",10,-10,"Independent research tree and queue."],["Smithy",-12,0,"Lord equipment crafting and upgrades."],["Hospital",12,0,"Healing queue; level controls capacity and speed. Attacker casualties split; defenders wounded; overflow dies."],["Rally Hall",-10,10,"Allied rally capacity."],["Embassy",0,12,"Reinforcement capacity and alliance help."],["Watchtower",10,10,"Progressively reveals enemy march intelligence."],["Market",-20,-10,"Alliance resource transfers; capacity and taxes."],["Treasury",20,-10,"Unlocks at 24; gold for Castle upgrades to 25+."],["Housing 1",-20,0,"Troop capacity."],["Housing 2",-20,10,"Troop capacity."],["Housing 3",20,0,"Troop capacity."],["Housing 4",20,10,"Troop capacity."],["Housing 5",0,20,"Troop capacity."],["City Wall",0,25,"Durability, defense, traps and repairs."]];const types=['Farmland','Woodcutter','Quarry','Iron Mine'];let slots=Array.from({length:20},(_,i)=>i===0?'Farmland':i===1?'Woodcutter':null);
function rand(){seed=seed*16807%2147483647;return seed/2147483647}
function face(arr,col,edge=false){faces.push({arr,col,edge})}
function flat(x,z,w,d,col,y=.01){face([[x-w/2,y,z-d/2],[x+w/2,y,z-d/2],[x+w/2,y,z+d/2],[x-w/2,y,z+d/2]],col)}
const stone=['#a8a18d','#77796e','#92907e','#bcb6a2','#c5bda7'],wood=['#95734c','#69503a','#806043','#b08c61','#b9a27b'];
function box(x,z,w,d,h,col,y=0){let a=x-w/2,b=x+w/2,k=z-d/2,l=z+d/2,p=[[a,y,k],[b,y,k],[b,y,l],[a,y,l],[a,y+h,k],[b,y+h,k],[b,y+h,l],[a,y+h,l]];[[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7],[4,5,6,7]].forEach((f,i)=>face(f.map(j=>p[j]),col[i%col.length],true))}

function house(x,z,w,d,h,col){box(x,z,w,d,h,col);roof(x,z,w+.5,d+.5,h,1.7);box(x,z+d/2+.03,1,.12,1.8,['#493525'])}
function tower(x,z){box(x,z,2.5,2.5,6,stone);box(x,z,3,3,.5,stone,6);for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++)if(Math.abs(i)===1||Math.abs(j)===1)box(x+i*1.1,z+j*1.1,.65,.65,.8,stone,6.5)}
function tree(x,z,h){box(x,z,.35,.35,h*.55,wood);for(let k=0;k<3;k++){let y=h*.25+k*h*.23,r=h*.34*(1-k*.23),p=[[x-r,y,z-r],[x+r,y,z-r],[x+r,y,z+r],[x-r,y,z+r]];for(let i=0;i<4;i++)face([p[i],p[(i+1)%4],[x,y+h*.65,z]],['#354e2b','#263e24','#46613a','#526a3b'][i])}}
let layers=[];function rebuild(){faces=[];buildings=[];seed=71;for(let x=-65;x<65;x+=4)for(let z=-65;z<65;z+=4)flat(x+2,z+2,4.04,4.04,['#697a43','#657640','#71804a','#60733d','#6c7c45'][Math.floor(rand()*5)],-.1);let terrain=faces;faces=[];flat(0,0,50,48,'#9b9676');for(let x of [-15,-5,5,15])flat(x,0,1.5,48,'#c1ae88');for(let z of [-15,-5,5,15])flat(0,z,50,1.5,'#c1ae88');let plots=faces;faces=[];for(let x of [-25,25]){box(x,0,1.3,50,2.5,stone);for(let z of [-25,25])tower(x,z)}box(0,-25,50,1.3,2.5,stone);for(let x of [-14,14])box(x,25,22,1.3,2.5,stone);for(let x of [-3,3])tower(x,25);
for(let [n,x,z,d] of defs){let locked=n==='Treasury'&&level<24||n.startsWith('Housing ')&&Number(n.slice(-1))>Math.min(5,1+Math.floor(level/10));let planned=level===1&&!['Castle','Barracks','Warehouse','City Wall','Housing 1'].includes(n);if(n==='City Wall'){buildings.push({n,x,z,h:3,d});continue}if(locked||planned){flat(x,z,7,7,'#77785d',.05);buildings.push({n,x,z,h:.5,d,locked,planned});continue}if(n==='Castle'){box(x,z,7,7,4,stone);box(x,z,4,4,7,stone);roof(x,z,4.5,4.5,7,2.5);for(let a of [-4,4])for(let b of [-4,4])tower(a,b);buildings.push({n,x,z,h:10,d});continue}if(n==='Watchtower')tower(x,z);else if(n.startsWith('Housing')){house(x-1.7,z,2.8,3,2,wood);house(x+1.7,z,2.8,3,2,wood)}else{house(x,z,6,5,3+(n==='Academy'?1:0),n==='Warehouse'||n==='Smithy'?wood:stone);if(n==='Smithy')box(x+2,z,1,1,5,stone);if(n==='Market')for(let k=-1;k<=1;k++)box(x+k*2,z+3,1.6,1.5,1.2,['#9e5140','#b69a58'])}buildings.push({n,x,z,h:n==='Watchtower'?7:5,d})}
let count=level>=25?20:level>=20?16:level>=15?12:level>=10?8:level>=5?6:4;for(let i=0;i<20;i++){let x=(i%5-2)*9,z=(i<10?1:-1)*(31+Math.floor(i%10/5)*9);let n=slots[i],locked=i>=count;flat(x,z,7.5,7.5,locked?'#515e42':'#8b7951',.04);if(!locked&&n){if(n==='Farmland'){for(let j=-3;j<=3;j++)flat(x+j,z,.5,6,'#c3ad59',.1)}else if(n==='Woodcutter'){house(x,z,4,3,2,wood);for(let j=0;j<3;j++)box(x+2,z+j*.6,2,.4,.4,wood)}else{box(x,z,4,4,1.5,stone);box(x,z,2,2,2,wood)}}buildings.push({n:locked?'Locked '+(i+1):n||'Plot '+(i+1),x,z,h:n&&!locked?3:.2,d:locked?'Unlocks at Castle '+([1,5,10,15,20,25].find((l,j)=>i<[4,6,8,12,16,20][j])):n?'Production until collection capacity. Uncollected resources lost on successful attack.':'Choose a resource building.',slot:i,locked})}for(let i=0;i<100;i++){let x=rand()*120-60,z=rand()*120-60;if(Math.abs(x)>30||Math.abs(z)>46)tree(x,z,2.5+rand()*3.5)}layers=[prepare(terrain),prepare(plots),prepare(faces,true)];dirty=true}
function iso(x,y,z){let a=x*cos-z*sin,b=x*sin+z*cos;return [a,b*.59-y,b+y*.15]}
function prepare(fs,sort=false){let p=fs.map(f=>{let v=f.arr.map(a=>iso(...a));return {v,col:f.col,edge:f.edge,depth:v.reduce((s,a)=>s+a[2],0)/v.length}});if(sort)p.sort((a,b)=>a.depth-b.depth);return p}rebuild();
function draw(){scale=Math.min(W/95,H/78)*zoom;ctx.setTransform(D,0,0,D,0,0);ctx.fillStyle='#354a2b';ctx.fillRect(0,0,W,H);for(let layer of layers)for(let f of layer){let v=f.v.map(a=>[W/2+px+a[0]*scale,H*.49+py+a[1]*scale]);if(v.every(a=>a[0]<-10)||v.every(a=>a[0]>W+10)||v.every(a=>a[1]<-10)||v.every(a=>a[1]>H+10))continue;ctx.beginPath();v.forEach((a,i)=>i?ctx.lineTo(a[0],a[1]):ctx.moveTo(a[0],a[1]));ctx.closePath();ctx.fillStyle=f.col;ctx.fill();if(f.edge){ctx.strokeStyle='#00000019';ctx.lineWidth=.6;ctx.stroke()}}labels=[];ctx.font='bold 11px sans-serif';ctx.textAlign='center';for(let b of buildings){let a=iso(b.x,b.h,b.z),p=[W/2+px+a[0]*scale,H*.49+py+a[1]*scale],w=ctx.measureText(b.n).width+18;ctx.fillStyle='#19271de8';ctx.fillRect(p[0]-w/2,p[1]-12,w,23);ctx.strokeStyle='#bba675';ctx.strokeRect(p[0]-w/2,p[1]-12,w,23);ctx.fillStyle='#f4e5c5';ctx.fillText(b.n,p[0],p[1]+3);labels.push({p,w,b})}}
function bounds(){let lim=Math.min(W/95,H/78)*zoom*55;px=Math.max(-lim,Math.min(lim,px));py=Math.max(-lim*.7,Math.min(lim*.7,py))}
function resize(){W=c.clientWidth;H=c.clientHeight;D=Math.min(devicePixelRatio||1,1.6);c.width=Math.round(W*D);c.height=Math.round(H*D);bounds();dirty=true}
const fingers=new Map();let start=null,moved=false,last=null,lastTime=0;
function pair(){let [a,b]=[...fingers.values()];return {x:(a.x+b.x)/2,y:(a.y+b.y)/2,d:Math.hypot(a.x-b.x,a.y-b.y)}}
function changeZoom(next,x=W/2,y=H*.49){let z=Math.max(.85,Math.min(3.5,next)),r=z/zoom;px=x-W/2-(x-W/2-px)*r;py=y-H*.49-(y-H*.49-py)*r;zoom=z;bounds();dirty=true}
c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);fingers.set(e.pointerId,{x:e.clientX,y:e.clientY});vx=vy=0;if(fingers.size===1){start={x:e.clientX,y:e.clientY};moved=false;lastTime=performance.now()}else{moved=true;last=fingers.size===2?pair():null}};
c.onpointermove=e=>{if(!fingers.has(e.pointerId))return;let old=fingers.get(e.pointerId),dx=e.clientX-old.x,dy=e.clientY-old.y;fingers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(fingers.size===1){if(start&&Math.hypot(e.clientX-start.x,e.clientY-start.y)>5)moved=true;if(moved){px+=dx;py+=dy;let now=performance.now(),dt=Math.max(12,now-lastTime);vx=.5*vx+.5*dx/dt*16;vy=.5*vy+.5*dy/dt*16;lastTime=now}}else if(fingers.size===2){let q=pair();if(last){px+=q.x-last.x;py+=q.y-last.y;if(last.d>8)changeZoom(zoom*q.d/last.d,q.x,q.y)}last=q;vx=vy=0}bounds();dirty=true};
function release(e,cancel=false){fingers.delete(e.pointerId);last=fingers.size===2?pair():null;if(fingers.size){moved=true;vx=vy=0;return}if(!moved&&!cancel){let l=labels.find(l=>Math.abs(e.clientX-l.p[0])<l.w/2+10&&Math.abs(e.clientY-l.p[1])<24);detail.hidden=!l;if(l)show(l.b);vx=vy=0}if(performance.now()-lastTime>90||cancel)vx=vy=0}
c.onpointerup=e=>release(e);c.onpointercancel=e=>release(e,true);c.addEventListener('wheel',e=>{e.preventDefault();changeZoom(zoom*Math.exp(-e.deltaY*.001),e.clientX,e.clientY)},{passive:false});document.querySelector('#plus').onclick=()=>changeZoom(zoom*1.2);document.querySelector('#minus').onclick=()=>changeZoom(zoom/1.2);document.querySelector('#home').onclick=()=>{px=py=vx=vy=0;zoom=1.15;detail.hidden=true;dirty=true};function frame(){if(!fingers.size&&Math.abs(vx)+Math.abs(vy)>.15){px+=Math.max(-12,Math.min(12,vx));py+=Math.max(-12,Math.min(12,vy));vx*=.78;vy*=.78;bounds();dirty=true}if(dirty){draw();dirty=false}requestAnimationFrame(frame)}new ResizeObserver(resize).observe(c);resize();frame();
function show(b){detail.hidden=false;detail.innerHTML='<button style="float:right" id="close">×</button><h3>'+b.n+'</h3><p>'+b.d+'</p>';document.querySelector('#close').onclick=()=>detail.hidden=true;if(b.planned)detail.insertAdjacentHTML('beforeend','<p>Planned building; unlock level undecided.</p>');if(b.slot!==undefined&&!b.locked){if(slots[b.slot]){let btn=document.createElement('button');btn.textContent='Demolish (no refund)';btn.onclick=()=>{slots[b.slot]=null;rebuild();detail.hidden=true};detail.append(btn)}else for(let t of types.slice(0,level>=11?4:level>=6?3:2)){let btn=document.createElement('button');btn.textContent='Build '+t;btn.onclick=()=>{slots[b.slot]=t;rebuild();detail.hidden=true};detail.append(btn)}}}document.querySelector('#preview').onchange=e=>{level=+e.target.value;document.querySelector('#lv').textContent='Castle Level '+level+' · preview';detail.hidden=true;rebuild()};document.querySelector('#lord').onclick=()=>show({n:'Lord · Level 1',d:'Earn XP and talent points for the Lord Tree. Values pending.'});document.querySelector('#collect').onclick=()=>show({n:'Collect All',d:'Interface preview only. Production timers and balances not implemented.'});</script></body></html>
