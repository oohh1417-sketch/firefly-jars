<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Castle Realms V0.3</title><style>*{box-sizing:border-box}html,body{margin:0;overflow:hidden;overscroll-behavior:none;background:#53643b;color:#f4e6c7;font-family:Georgia}canvas{width:100vw;height:100dvh;display:block;touch-action:none}header,aside,footer{position:fixed;padding:14px}header{top:env(safe-area-inset-top);pointer-events:none;text-shadow:0 2px 4px #000}aside{right:0;top:env(safe-area-inset-top);display:grid;gap:8px}footer{bottom:env(safe-area-inset-bottom);width:100%;display:flex;justify-content:space-between;align-items:center}button{background:#25352d;color:#f8e9c8;border:1px solid #b4a178;border-radius:8px;min-height:44px;min-width:44px;font:18px Georgia}small{background:#18271de0;padding:8px}#detail{position:fixed;bottom:85px;left:12px;right:12px;background:#19251fee;padding:14px;border:1px solid #a99465;border-radius:8px}</style></head><body><canvas id="land"></canvas><header><small>CASTLE REALMS · V0.3</small><h2>Your Kingdom</h2>Castle Level 1</header><aside><button id="plus">+</button><button id="minus">−</button></aside><div id="detail" hidden></div><footer><small>Drag to move · Pinch to zoom</small><button id="home">⌂ Castle</button></footer><script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d'),detail=document.querySelector('#detail');let W,H,D,zoom=1.35,px=0,py=0,vx=0,vy=0,dirty=true,scale=1,faces=[],labels=[],seed=71;const cos=Math.cos(.65),sin=Math.sin(.65);
const buildings=[{x:0,z:0,n:'Castle',h:10,d:'The heart of your kingdom. Level 1.'},{x:-12,z:8,n:'Farmland',h:1,d:'Produces food.'},{x:-13,z:-10,n:'Woodcutter',h:5,d:'Produces wood.'},{x:12,z:6,n:'Barracks',h:5,d:'Trains soldiers.'},{x:12,z:-9,n:'Warehouse',h:5,d:'Stores resources.'}];
function rand(){seed=seed*16807%2147483647;return seed/2147483647}
function face(arr,col,edge=false){faces.push({arr,col,edge})}
function flat(x,z,w,d,col,y=.01){face([[x-w/2,y,z-d/2],[x+w/2,y,z-d/2],[x+w/2,y,z+d/2],[x-w/2,y,z+d/2]],col)}
const stone=['#a8a18d','#77796e','#92907e','#bcb6a2','#c5bda7'],wood=['#95734c','#69503a','#806043','#b08c61','#b9a27b'];
function box(x,z,w,d,h,col,y=0){let a=x-w/2,b=x+w/2,k=z-d/2,l=z+d/2,p=[[a,y,k],[b,y,k],[b,y,l],[a,y,l],[a,y+h,k],[b,y+h,k],[b,y+h,l],[a,y+h,l]];[[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7],[4,5,6,7]].forEach((f,i)=>face(f.map(j=>p[j]),col[i%col.length],true))}
function roof(x,z,w,d,y,h){let a=x-w/2,b=x+w/2,k=z-d/2,l=z+d/2;face([[a,y,k],[b,y,k],[b,y+h,z],[a,y+h,z]],'#684431');face([[a,y,l],[b,y,l],[b,y+h,z],[a,y+h,z]],'#95603e');face([[a,y,k],[a,y,l],[a,y+h,z]],'#593b29');face([[b,y,k],[b,y,l],[b,y+h,z]],'#795039')}
function house(x,z,w,d,h,col){box(x,z,w,d,h,col);roof(x,z,w+.5,d+.5,h,1.7);box(x,z+d/2+.03,1,.12,1.8,['#493525'])}
function tower(x,z){box(x,z,2.5,2.5,6,stone);box(x,z,3,3,.5,stone,6);for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++)if(Math.abs(i)===1||Math.abs(j)===1)box(x+i*1.1,z+j*1.1,.65,.65,.8,stone,6.5)}
function tree(x,z,h){box(x,z,.35,.35,h*.55,wood);for(let k=0;k<3;k++){let y=h*.25+k*h*.23,r=h*.34*(1-k*.23),p=[[x-r,y,z-r],[x+r,y,z-r],[x+r,y,z+r],[x-r,y,z+r]];for(let i=0;i<4;i++)face([p[i],p[(i+1)%4],[x,y+h*.65,z]],['#354e2b','#263e24','#46613a','#526a3b'][i])}}
for(let x=-45;x<45;x+=3)for(let z=-45;z<45;z+=3)flat(x+1.5,z+1.5,3.04,3.04,['#697a43','#657640','#71804a','#60733d','#6c7c45'][Math.floor(rand()*5)],-.1);
const terrain=faces;faces=[];flat(0,0,2.8,34,'#aa9770');flat(0,7,29,2.5,'#aa9770');flat(0,-9,29,2.5,'#aa9770');flat(0,0,11,11,'#a09878');flat(-12,8,9,8,'#685133');for(let i=0;i<8;i++){flat(-15.5+i,8,.45,7,'#b9a45b',.05);for(let j=0;j<6;j++)flat(-15.5+i,5+j*1.1,.5,.5,'#c8b96a',.08)}flat(-13,-10,8,7,'#8b8055');flat(12,6,8,7,'#93845f');flat(12,-9,8,7,'#93845f');const plots=faces;faces=[];box(0,0,7,7,4,stone);box(0,0,4,4,7,stone);roof(0,0,4.5,4.5,7,2.5);for(let x of [-4,4])for(let z of [-4,4])tower(x,z);box(0,3.55,1.8,.12,2.5,['#403329']);house(-13,-10,4.5,3.5,2.3,wood);for(let i=0;i<4;i++)box(-10.2,-11+i*.65,2,.45,.4,wood);house(12,6,6,4,3,stone);house(12,-9,6,4.5,3,wood);for(let i=0;i<110;i++){let x=rand()*84-42,z=rand()*84-42;if(Math.abs(x)>20||Math.abs(z)>19)tree(x,z,2.5+rand()*3.5)}
function iso(x,y,z){let a=x*cos-z*sin,b=x*sin+z*cos;return [a,b*.59-y,b+y*.15]}
function prepare(fs,sort=false){let p=fs.map(f=>{let v=f.arr.map(a=>iso(...a));return {v,col:f.col,edge:f.edge,depth:v.reduce((s,a)=>s+a[2],0)/v.length}});if(sort)p.sort((a,b)=>a.depth-b.depth);return p}const layers=[prepare(terrain),prepare(plots),prepare(faces,true)];
function draw(){scale=Math.min(W/65,H/49)*zoom;ctx.setTransform(D,0,0,D,0,0);ctx.fillStyle='#354a2b';ctx.fillRect(0,0,W,H);for(let layer of layers)for(let f of layer){let v=f.v.map(a=>[W/2+px+a[0]*scale,H*.49+py+a[1]*scale]);if(v.every(a=>a[0]<-10)||v.every(a=>a[0]>W+10)||v.every(a=>a[1]<-10)||v.every(a=>a[1]>H+10))continue;ctx.beginPath();v.forEach((a,i)=>i?ctx.lineTo(a[0],a[1]):ctx.moveTo(a[0],a[1]));ctx.closePath();ctx.fillStyle=f.col;ctx.fill();if(f.edge){ctx.strokeStyle='#00000019';ctx.lineWidth=.6;ctx.stroke()}}labels=[];ctx.font='bold 11px sans-serif';ctx.textAlign='center';for(let b of buildings){let a=iso(b.x,b.h,b.z),p=[W/2+px+a[0]*scale,H*.49+py+a[1]*scale],w=ctx.measureText(b.n).width+18;ctx.fillStyle='#19271de8';ctx.fillRect(p[0]-w/2,p[1]-12,w,23);ctx.strokeStyle='#bba675';ctx.strokeRect(p[0]-w/2,p[1]-12,w,23);ctx.fillStyle='#f4e5c5';ctx.fillText(b.n,p[0],p[1]+3);labels.push({p,w,b})}}
function bounds(){let lim=Math.min(W/65,H/49)*zoom*27;px=Math.max(-lim,Math.min(lim,px));py=Math.max(-lim*.7,Math.min(lim*.7,py))}
function resize(){W=c.clientWidth;H=c.clientHeight;D=Math.min(devicePixelRatio||1,1.6);c.width=Math.round(W*D);c.height=Math.round(H*D);bounds();dirty=true}
const fingers=new Map();let start=null,moved=false,last=null,lastTime=0;
function pair(){let [a,b]=[...fingers.values()];return {x:(a.x+b.x)/2,y:(a.y+b.y)/2,d:Math.hypot(a.x-b.x,a.y-b.y)}}
function changeZoom(next,x=W/2,y=H*.49){let z=Math.max(.85,Math.min(3.5,next)),r=z/zoom;px=x-W/2-(x-W/2-px)*r;py=y-H*.49-(y-H*.49-py)*r;zoom=z;bounds();dirty=true}
c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);fingers.set(e.pointerId,{x:e.clientX,y:e.clientY});vx=vy=0;if(fingers.size===1){start={x:e.clientX,y:e.clientY};moved=false;lastTime=performance.now()}else{moved=true;last=fingers.size===2?pair():null}};
c.onpointermove=e=>{if(!fingers.has(e.pointerId))return;let old=fingers.get(e.pointerId),dx=e.clientX-old.x,dy=e.clientY-old.y;fingers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(fingers.size===1){if(start&&Math.hypot(e.clientX-start.x,e.clientY-start.y)>5)moved=true;if(moved){px+=dx;py+=dy;let now=performance.now(),dt=Math.max(12,now-lastTime);vx=.5*vx+.5*dx/dt*16;vy=.5*vy+.5*dy/dt*16;lastTime=now}}else if(fingers.size===2){let q=pair();if(last){px+=q.x-last.x;py+=q.y-last.y;if(last.d>8)changeZoom(zoom*q.d/last.d,q.x,q.y)}last=q;vx=vy=0}bounds();dirty=true};
function release(e,cancel=false){fingers.delete(e.pointerId);last=fingers.size===2?pair():null;if(fingers.size){moved=true;vx=vy=0;return}if(!moved&&!cancel){let l=labels.find(l=>Math.abs(e.clientX-l.p[0])<l.w/2+10&&Math.abs(e.clientY-l.p[1])<24);detail.hidden=!l;if(l)detail.textContent=l.b.n+' — '+l.b.d;vx=vy=0}if(performance.now()-lastTime>90||cancel)vx=vy=0}
c.onpointerup=e=>release(e);c.onpointercancel=e=>release(e,true);c.addEventListener('wheel',e=>{e.preventDefault();changeZoom(zoom*Math.exp(-e.deltaY*.001),e.clientX,e.clientY)},{passive:false});document.querySelector('#plus').onclick=()=>changeZoom(zoom*1.2);document.querySelector('#minus').onclick=()=>changeZoom(zoom/1.2);document.querySelector('#home').onclick=()=>{px=py=vx=vy=0;zoom=1.35;detail.hidden=true;dirty=true};function frame(){if(!fingers.size&&Math.abs(vx)+Math.abs(vy)>.15){px+=Math.max(-12,Math.min(12,vx));py+=Math.max(-12,Math.min(12,vy));vx*=.78;vy*=.78;bounds();dirty=true}if(dirty){draw();dirty=false}requestAnimationFrame(frame)}new ResizeObserver(resize).observe(c);resize();frame();
</script></body></html>
